name: Actualizar datos

on:
  workflow_dispatch:
  push:
    paths: ['transmision.json']
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bajar y armar datos
        run: python3 actualizar.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-agenda"
          git config user.email "robot-agenda@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
