<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda F1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E10600'/%3E%3Cpath d='M12 44l12-24h28l-6 12H34l-3 6h10l-6 6z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#111111">
<style>
:root{--bg:#F5F4F2;--sf:#fff;--ink:#111;--mute:#5F5F5B;--line:#E0DED8;--red:#E10600;--disney:#1B5BD8}
@media(prefers-color-scheme:dark){:root{--bg:#0D0D0E;--sf:#18181A;--ink:#F4F3F0;--mute:#A5A49E;--line:#2D2D30;--red:#FF3B30;--disney:#6C9BFF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;overflow:hidden;margin-top:14px;padding:18px 16px 24px;border-radius:14px;background:#111;color:#fff}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#E10600,#000,#E10600) 0 0/320px 100%;animation:bar 6s linear infinite}
@keyframes bar{to{background-position:320px 0}}
h1{margin:0;font:800 32px/1 'Arial Narrow',Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.sub{color:rgba(255,255,255,.7);font-size:13px;margin-top:4px}
nav{display:flex;border-bottom:1px solid var(--line);margin-top:12px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font-weight:700;font-size:14px;font-family:inherit;padding:12px 2px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.gp{margin-top:18px}.gp h2{margin:0;font-size:24px;line-height:1.1}.gp .lug{color:var(--mute);font-size:14px;margin:3px 0 10px}
.cd{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.cd b{font-size:22px;font-variant-numeric:tabular-nums}.cd small{display:block;color:var(--mute)}
.dia{font-weight:700;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.s{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px}
.s.pas{opacity:.5}.s.ya{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.s.carrera{border-left:5px solid var(--red)}
.hora{font:700 22px/1 'Arial Narrow',Arial,sans-serif;font-variant-numeric:tabular-nums}
.nom{font-weight:600}.dis{font-size:12px;font-weight:600;color:var(--disney)}
.pill{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:2px 6px;margin-left:6px}
details{background:var(--sf);border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:0 12px}
details.pas{opacity:.55}details.prox{border-left:5px solid var(--red)}
summary{cursor:pointer;padding:11px 0;display:flex;justify-content:space-between;gap:10px;font-weight:600}
summary span:last-child{color:var(--mute);font-weight:400;font-size:14px;white-space:nowrap}
details .s{border:0;padding:6px 0;margin:0;background:none}
.vacio{padding:28px 8px;text-align:center;color:var(--mute)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb{margin-top:8px}
.r{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c,#888);border-radius:8px;padding:5px 10px;margin-bottom:4px}
details .r{background:none}.r.fv{position:relative;overflow:hidden}.r>span,.r>b{position:relative}
.fx{position:absolute;inset:0;overflow:hidden;opacity:.42}
.fx b{position:absolute;inset:-120px;background:repeating-linear-gradient(135deg,var(--c1) 0,var(--c2) 60px,var(--c1) 120px);animation:mv 6s linear infinite}
@keyframes mv{to{transform:translate(85px,85px)}}
.anim{flex:none}.o{transform-origin:50px 50px}.o1{animation:s1 12s linear infinite}
.o2{opacity:0;animation:s2 12s linear infinite}.o3{opacity:0;animation:s3 12s linear infinite}.o4{opacity:0;animation:s4 12s linear infinite}
@keyframes s1{0%,22%{opacity:1;transform:scale(1)}25%,97%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes s2{0%,22%{opacity:0;transform:scale(.4)}25%,47%{opacity:1;transform:scale(1)}50%,100%{opacity:0;transform:scale(.4)}}
@keyframes s3{0%,47%{opacity:0;transform:scale(.4)}50%,72%{opacity:1;transform:scale(1)}75%,100%{opacity:0;transform:scale(.4)}}
@keyframes s4{0%,72%{opacity:0;transform:scale(.4)}75%,97%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
.spin{transform-origin:50px 50px;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.nod{transform-origin:50px 80px;animation:nod 1.4s ease-in-out infinite alternate}@keyframes nod{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.wob{transform-origin:50px 50px;animation:wob 2s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.wave{transform-origin:26px 38px;animation:wave .7s ease-in-out infinite alternate}@keyframes wave{from{transform:skewY(-7deg) scaleX(1)}to{transform:skewY(7deg) scaleX(.93)}}
@media (prefers-reduced-motion:reduce){.fx b,header::after,.anim *{animation:none!important}}
.r .p{color:var(--mute);font-weight:700}.r .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r small{display:inline;margin-left:7px;color:var(--mute);font-weight:400;font-size:12px}.r b{font-variant-numeric:tabular-nums}
.nota{color:var(--mute);font-size:12px;margin-top:8px}
.fb{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:8px;cursor:pointer}
.fl{flex:none;width:76px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.fi{flex:1;display:flex;gap:12px;overflow-x:auto;white-space:nowrap}
.fc{border-left:4px solid var(--c,#888);padding-left:7px;font-weight:600;font-size:14px}
.fc b{font-weight:400;color:var(--mute);font-size:12px;margin-left:5px}
.fi em{color:var(--mute);font-size:13px}
.fbtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:700;font-size:15px;font-family:inherit;text-align:left;cursor:pointer}
.fbtn .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-weight:400;font-size:13px}
.fpanel{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:2px 12px 10px;margin-top:6px}
.fpanel .chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Agenda F1</h1><div class="sub" id="act">Cargando…</div></div><svg class="anim" viewBox="0 0 100 100" width="76" height="76" aria-hidden="true"><g class="o o1"><g class="spin"><circle cx="50" cy="50" r="40" fill="#1b1b1b"/><circle cx="50" cy="50" r="37" fill="none" stroke="#4a4a4a" stroke-width="6" stroke-dasharray="5 5"/><circle cx="50" cy="50" r="27" fill="none" stroke="#E10600" stroke-width="4"/><circle cx="50" cy="50" r="15" fill="#d9d9d9"/><circle cx="60.0" cy="50.0" r="2" fill="#1b1b1b"/><circle cx="53.1" cy="59.5" r="2" fill="#1b1b1b"/><circle cx="41.9" cy="55.9" r="2" fill="#1b1b1b"/><circle cx="41.9" cy="44.1" r="2" fill="#1b1b1b"/><circle cx="53.1" cy="40.5" r="2" fill="#1b1b1b"/></g></g><g class="o o2"><g class="nod"><path d="M16 64C16 36 32 18 54 18C75 18 88 34 88 56V66C88 70 85 73 81 73H26C20 73 16 69 16 64Z" fill="#E10600"/><path d="M52 38H88V57H58C49 57 46 41 52 38Z" fill="#111" stroke="#fff" stroke-width="2.5"/><path d="M16 50H44" stroke="#fff" stroke-width="5"/><path d="M58 44L80 42" stroke="#fff" stroke-width="2" opacity=".6"/><rect x="30" y="73" width="46" height="6" rx="3" fill="#333"/></g></g><g class="o o3"><g class="wob"><rect x="6" y="30" width="18" height="42" rx="8" fill="#E10600"/><rect x="76" y="30" width="18" height="42" rx="8" fill="#E10600"/><rect x="14" y="34" width="72" height="34" rx="14" fill="#222" stroke="#fff" stroke-width="3"/><rect x="34" y="40" width="32" height="15" rx="3" fill="#111" stroke="#4ade80" stroke-width="2"/><circle cx="40" cy="62" r="3" fill="#E10600"/><circle cx="50" cy="62" r="3" fill="#FFD600"/><circle cx="60" cy="62" r="3" fill="#4ade80"/><circle cx="26" cy="48" r="4" fill="#fff"/><circle cx="74" cy="48" r="4" fill="#fff"/></g></g><g class="o o4"><rect x="22" y="12" width="4" height="78" rx="2" fill="#d9d9d9"/><g class="wave"><rect x="26" y="18" width="60" height="40" fill="#fff"/><rect x="26" y="18" width="10" height="10" fill="#111"/><rect x="46" y="18" width="10" height="10" fill="#111"/><rect x="66" y="18" width="10" height="10" fill="#111"/><rect x="36" y="28" width="10" height="10" fill="#111"/><rect x="56" y="28" width="10" height="10" fill="#111"/><rect x="76" y="28" width="10" height="10" fill="#111"/><rect x="26" y="38" width="10" height="10" fill="#111"/><rect x="46" y="38" width="10" height="10" fill="#111"/><rect x="66" y="38" width="10" height="10" fill="#111"/><rect x="36" y="48" width="10" height="10" fill="#111"/><rect x="56" y="48" width="10" height="10" fill="#111"/><rect x="76" y="48" width="10" height="10" fill="#111"/></g></g></svg></header>
<div id="favbar"></div>
<nav id="tabs"><button data-t="inicio" aria-selected="true">Inicio</button><button data-t="cal" aria-selected="false">Calendario</button><button data-t="pos" aria-selected="false">Posiciones</button></nav>
<main id="main"></main>
</div>
<script>
const TZ='America/Argentina/Buenos_Aires';
const NOM={FP1:'Práctica libre 1',FP2:'Práctica libre 2',FP3:'Práctica libre 3',SQ:'Clasificación sprint',SPR:'Sprint',Q:'Clasificación',R:'Carrera'};
const DUR={FP1:60,FP2:60,FP3:60,SQ:45,SPR:60,Q:60,R:120};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fh=d=>d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ});
const fd=d=>cap(d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric',timeZone:TZ}));
const fc=d=>d.toLocaleDateString('es-AR',{day:'numeric',month:'short',timeZone:TZ}).replace('.','');
const dayK=d=>d.toLocaleDateString('en-CA',{timeZone:TZ});
let D=null,tab='inicio',sub='p',panel=false,F={p:[],e:[]};
try{F=JSON.parse(localStorage.getItem('f1_favs'))||F}catch(e){}
const TC={mercedes:['#27F4D2','#6C6C6C'],ferrari:['#E8002D','#FFEB00'],mclaren:['#FF8000','#47C7FC'],red_bull:['#3671C6','#E10A3C'],rb:['#6692FF','#E8E8E8'],alpine:['#FF87BC','#0093CC'],haas:['#B6BABD','#E6002B'],audi:['#F50537','#C9C9C9'],williams:['#64C4FF','#00339A'],aston_martin:['#229971','#CEDC00'],cadillac:['#AAAAAD','#1D3FA8']};
const col=id=>TC[id]||['#888','#ccc'],tc=id=>col(id)[0],fx=id=>{const k=col(id);return`<i class="fx"><b style="--c1:${k[0]};--c2:${k[1]}"></b></i>`};
const isF=(t,k)=>F[t].includes(k);
const toggle=(t,k)=>{F[t]=isF(t,k)?F[t].filter(x=>x!==k):[...F[t],k];try{localStorage.setItem('f1_favs',JSON.stringify(F))}catch(e){}};
const ses=c=>c.sesiones.map(s=>({...s,a:new Date(s.t),b:new Date(+new Date(s.t)+DUR[s.k]*6e4)}));
const fin=c=>{const s=ses(c);return s[s.length-1].b};
function sesHtml(c){
  const now=new Date();let last='';
  return ses(c).map(s=>{
    const k=dayK(s.a),h=k!==last?`<div class="dia">${fd(s.a)}</div>`:'';last=k;
    const ya=now>=s.a&&now<s.b,pas=now>=s.b;
    return h+`<div class="s${pas?' pas':''}${ya?' ya':''}${s.k==='R'?' carrera':''}"><div class="hora">${fh(s.a)}</div><div><div class="nom">${NOM[s.k]}${ya?'<span class="pill">EN CURSO</span>':''}</div>${s.d?`<div class="dis">Disney+ ${s.d[0]} a ${s.d[1]}</div>`:''}</div></div>`;
  }).join('');
}
function cuenta(c){
  const now=new Date(),p=ses(c).find(s=>s.b>now);if(!p)return'';
  if(now>=p.a)return`<div class="cd"><b>${NOM[p.k]} en curso</b></div>`;
  let m=Math.floor((p.a-now)/6e4);const d=Math.floor(m/1440),h=Math.floor(m%1440/60);m%=60;
  return`<div class="cd"><small>Próxima sesión: ${NOM[p.k]}</small><b>${d?d+' d ':''}${h} h ${m} min</b></div>`;
}
function inicio(){
  const now=new Date(),c=D.carreras.find(c=>fin(c)>now);
  if(!c)return'<div class="vacio">La temporada terminó. ¡Hasta la próxima!</div>';
  return`<section class="gp"><h2>${c.nombre}</h2><div class="lug">Fecha ${c.ronda} · ${c.circuito}, ${c.ciudad}</div>${cuenta(c)}${sesHtml(c)}</section>`;
}
function cal(){
  const now=new Date(),nx=D.carreras.find(c=>fin(c)>now);
  return D.carreras.map(c=>{const s=ses(c),pas=fin(c)<=now,prox=nx&&nx.ronda===c.ronda;
    return`<details class="${pas?'pas':''}${prox?' prox':''}"><summary><span>${c.ronda}. ${c.nombre.replace(' Grand Prix','')}</span><span>${fc(s[s.length-1].a)}</span></summary>${pas&&D.resultados&&D.resultados[c.ronda]?resHtml(c):sesHtml(c)}</details>`}).join('');
}
const fila=(pos,t,k,n,s2,pts,eq)=>`<div class="r${isF(t,k)?' fv':''}" data-f="${t}:${k}" style="--c:${tc(eq)}">${isF(t,k)?fx(eq):''}<span class="p">${pos}</span><span class="n">${n}<small>${s2}</small></span><b>${pts}</b></div>`;
const fp=x=>fila(x.pos,'p',x.cod,ap(x),x.equipo,x.pts,x.equipoId),fe=(x,s)=>fila(x.pos,'e',x.id,x.nombre,s||'',x.pts,x.id);
function posiciones(){
  const ch=`<div class="ctrl"><button class="chip" data-sub="p" aria-pressed="${sub==='p'}">Pilotos</button><button class="chip" data-sub="e" aria-pressed="${sub==='e'}">Escuderías</button></div>`;
  return ch+'<div class="tb">'+(sub==='p'?D.pilotos.map(fp):D.constructores.map(x=>fe(x))).join('')+'</div><div class="nota">Tocá una fila para marcar o sacar un favorito.</div>';
}
function resHtml(c){
  const r=D.resultados&&D.resultados[c.ronda];if(!r)return'';
  return'<div class="tb">'+r.map(x=>`<div class="r${isF('p',x.cod)?' fv':''}" style="--c:${tc(x.eq)}">${isF('p',x.cod)?fx(x.eq):''}<span class="p">${x.pos}</span><span class="n">${x.ape}<small>Largó ${x.grid==='0'?'desde boxes':x.grid+'º'} · ${x.tiempo||x.estado}</small></span><b>${x.pts}</b></div>`).join('')+'</div>';
}
const ap=x=>x.ape||x.nombre.split(' ').slice(-1)[0];
function favBar(){
  const ps=D.pilotos.filter(x=>isF('p',x.cod)),es=D.constructores.filter(x=>isF('e',x.id));
  const names=[...ps.map(x=>ap(x)),...es.map(x=>x.nombre)].join(' · ');
  const chip=(t,k,l)=>`<button class="chip" data-f="${t}:${k}" aria-pressed="${isF(t,k)}">${l}</button>`;
  document.getElementById('favbar').innerHTML=`<button class="fbtn" aria-expanded="${panel}">★ Favoritos (${ps.length+es.length})<span class="fn">${names}</span><span>${panel?'▴':'▾'}</span></button>`+
   (panel?`<div class="fpanel"><div class="dia">Pilotos</div><div class="ctrl">${D.pilotos.map(x=>chip('p',x.cod,ap(x))).join('')}</div><div class="dia">Escuderías</div><div class="ctrl">${D.constructores.map(x=>chip('e',x.id,x.nombre)).join('')}</div></div>`:'');
}
function render(){
  if(!D)return;favBar();
  document.getElementById('main').innerHTML=D.carreras&&D.carreras.length?({inicio,cal,pos:posiciones}[tab])():'<div class="vacio">Todavía no hay datos.</div>';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
}
document.getElementById('main').addEventListener('click',e=>{
  const s=e.target.closest('[data-sub]');if(s){sub=s.dataset.sub;render();return}
  const f=e.target.closest('[data-f]');if(f){const[t,k]=f.dataset.f.split(':');toggle(t,k);render()}
});
document.getElementById('favbar').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');
  if(f){const[t,k]=f.dataset.f.split(':');toggle(t,k);render();return}
  if(e.target.closest('.fbtn')){panel=!panel;render()}
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render()}});
function cargar(){
  return fetch('data.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
    const f=!D;D=d;document.getElementById('act').textContent='Horarios de Argentina · datos del '+new Date(d.actualizado).toLocaleString('es-AR',{timeZone:TZ,day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
    if(f||tab==='inicio')render();
  }).catch(()=>{document.getElementById('act').textContent='No se pudieron cargar los datos'});
}
cargar();setInterval(()=>{if(tab==='inicio')render()},30000);setInterval(cargar,600000);
</script>
</body>
</html>
